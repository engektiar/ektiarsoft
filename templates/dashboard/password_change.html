{% extends "dashboard/base.html" %}{% load ui %}
{% block page_title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block dash %}
<div class="card panel form-card" style="max-width:560px">
  <div class="panel-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}<div style="margin-bottom:14px">{% include "dashboard/_field.html" %}</div>{% endfor %}
      <div class="form-actions"><a href="{% url 'accounts:profile' %}" class="btn btn-ghost">Cancel</a><button class="btn btn-primary" type="submit">Update password</button></div>
    </form>
  </div>
</div>
{% endblock %}
