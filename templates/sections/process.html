{% extends "sections/_base.html" %}{% load ui %}
{% block body %}{% include "sections/_head.html" %}
<div class="grid {% if section.rows|length == 3 %}grid-3{% else %}grid-4{% endif %} process">
  {% for r in section.rows %}
  <div class="card reveal"><div class="card-icon">{% icon r.0 24 %}</div><h3>{{ r.1 }}</h3>{% if r.2 %}<p>{{ r.2 }}</p>{% endif %}</div>
  {% endfor %}
</div>{% endblock %}
