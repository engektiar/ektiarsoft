{% extends "base.html" %}
{% block title %}Page not found | {{ site.site_name }}{% endblock %}
{% block robots %}noindex{% endblock %}
{% block content %}
<section class="auth-wrap center">
  <div>
    <p class="mono grad-text" style="font-size:clamp(5rem,18vw,10rem);font-weight:700;line-height:1;margin:0">404</p>
    <h1 style="font-size:2rem">This page returned <code>None</code>.</h1>
    <p class="muted">The page you're looking for doesn't exist or has moved.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary">Back to home</a>
  </div>
</section>
{% endblock %}
